<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Velmenni</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #0e1749, #1f3c88, #00fff2, #ecf0f1);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.thank-you-container {
    background: rgba(255, 255, 255, 0.1);
    padding: 2rem 3rem;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    max-width: 500px;
}

h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #fff;
}

p {
    font-size: 1.2rem;
    color: #f1f1f1;
}

a {
    display: inline-block;
    margin-top: 2rem;
    text-decoration: none;
    background: #0e1749;
    color: #fff;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    transition: background 0.3s ease;
}

a:hover {
    background: #159c82;
}
</style>
</head>
<body>
    <div class="logo-container">
        <a href="index.html" style="text-decoration: none; color: white;">
            <img src="https://cdn.prod.website-files.com/61a9889b624de53b8f5cbd61/6216419d583e5a3cb4c0cea3_Velmenni_logo.png" alt="Velmenni Logo" style="height: 50px; margin-right: 15px;" />
        </a>
    </div>
    <div class="thank-you-container">
        <h1>Thank You for Scheduling a Demo!</h1>
        <p>We’ve received your request and will get back to you shortly.</p>
        <a href="index.html">← Back to Home</a>
    </div>
</body>
</html>
